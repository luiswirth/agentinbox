[package]
name = "mindio"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
jiff = "0.2.45"
mime2ext = "0.1.54"
mime_guess = "2.0.5"
libc = "0.2.191"
notify = "9.0.0"

# The command line, which a crate that only delivers can leave out.
[features]
default = ["cli"]
cli = ["dep:clap"]

[[bin]]
name = "mindio"
required-features = ["cli"]
