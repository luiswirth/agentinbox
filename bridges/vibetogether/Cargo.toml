[package]
name = "agentinbox-vibetogether"
version = "0.1.0"
edition = "2024"

[dependencies]
agentinbox = { path = "../.." }
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
ureq = { version = "3.5.2", features = ["json"] }

[dev-dependencies]
serde_json = "1.0.154"
